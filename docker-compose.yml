# Production-style setup: the bot plus PostgreSQL.
#   cp .env.example .env   # then fill in BOT_TOKEN, ALLOWED_CHAT_IDS, ADMIN_USER_IDS
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qul}
      POSTGRES_DB: qul_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qul -d qul_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides the SQLite default from .env
      DATABASE_URL: postgresql+asyncpg://qul:${POSTGRES_PASSWORD:-qul}@db:5432/qul_bot

volumes:
  pgdata:
