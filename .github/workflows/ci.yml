name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qul
          POSTGRES_PASSWORD: qul
          POSTGRES_DB: qul_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qul -d qul_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://qul:qul@localhost:5432/qul_test
